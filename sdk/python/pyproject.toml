[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ordercore"
version = "0.1.0"
description = "OrderCore SDK - commerce API for AI agents: catalog, idempotent orders, checkout sessions. Stdlib-only, Python 3.8+."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Cloudpeakify s.r.o." }]
requires-python = ">=3.8"
keywords = [
  "ordercore", "commerce", "checkout", "orders", "idempotency",
  "ai-agents", "agentic-commerce", "mcp", "api-client",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://ordercore.ai"
Documentation = "https://ordercore.ai/docs.md"
Repository = "https://github.com/RulezZzOr/ordercore-examples"

[tool.setuptools.packages.find]
include = ["ordercore*"]
